<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>중앙대 산책 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#a9d3f5;font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.panel{position:absolute;background:rgba(18,22,30,.72);color:#fff;border-radius:12px;backdrop-filter:blur(4px)}
#help{left:16px;top:16px;padding:12px 16px 14px;font-size:13px;line-height:1.85;max-width:290px}
#help b{font-size:16px;display:block;margin-bottom:4px}
#help .x{position:absolute;right:10px;top:6px;cursor:pointer;opacity:.7;font-size:16px}
.k{display:inline-block;min-width:16px;text-align:center;padding:0 5px;border:1px solid rgba(255,255,255,.45);border-radius:4px;font-size:11.5px;line-height:18px;margin-right:2px}
#map{right:16px;top:16px;width:160px;height:160px}
#loc{left:50%;top:18px;transform:translateX(-50%);padding:7px 16px;border-radius:20px;font-size:15px;font-weight:700;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
#btns{position:absolute;right:16px;bottom:16px;display:flex;gap:8px}
button{background:rgba(18,22,30,.75);color:#fff;border:0;border-radius:12px;padding:11px 15px;font-size:14px;cursor:pointer;font-family:inherit}
button:active{transform:scale(.96)}
#jump{display:none;width:72px;height:72px;border-radius:50%;font-size:15px}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);display:none;pointer-events:none}
#knob{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.7)}
#net{left:16px;bottom:16px;padding:8px 10px 8px 14px;font-size:13px;display:flex;align-items:center;gap:10px}
#nick{width:84px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:8px;color:#fff;padding:5px 8px;font-family:inherit;font-size:13px}
#chatWrap{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:none}
#chatIn{width:min(420px,70vw);background:rgba(18,22,30,.85);border:1px solid rgba(255,255,255,.35);border-radius:12px;color:#fff;padding:11px 14px;font-family:inherit;font-size:15px;outline:none}
#err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#223;font-size:16px;text-align:center;padding:20px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#234;font-size:18px;font-weight:700}

<canvas id="c"></canvas>

<div id="help" class="panel">
  <span class="x" id="helpX">✕</span>
  <b>🏫 중앙대 산책</b>
  <div id="helpPC">

    <span class="k">Shift</span> 달리기 · <span class="k">Space</span> 점프<br>
    마우스 드래그: 시점 돌리기 · 휠·+/− 키: 줌 (멀리~1인칭)<br>
    <span class="k">E</span> 탈것 타기/내리기 (자전거·오토바이·차·버스)<br><span class="k">N</span> 낮/밤 전환 · <span class="k">H</span> 도움말 숨기기<br>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const DOORS=[];

/* ---------- 실제 지도 기반 좌표 ---------- */

/* ---------- 충돌 (회전된 건물 포함) ---------- */
function collide(p,r,list){for(const b of list){
  if(b.hx!==undefined){const dx=p.x-b.cx,dz=p.z-b.cz;let lx=dx*b.c-dz*b.s,lz=dx*b.s+dz*b.c;
    if(Math.abs(lx)<b.hx+r&&Math.abs(lz)<b.hz+r){const px=b.hx+r-Math.abs(lx),pz=b.hz+r-Math.abs(lz);
      if(px<pz)lx+=Math.sign(lx||1)*px;else lz+=Math.sign(lz||1)*pz;
      p.x=b.cx+lx*b.c+lz*b.s;p.z=b.cz-lx*b.s+lz*b.c;}continue;}
  if(p.x+r>b.x0&&p.x-r<b.x1&&p.z+r>b.z0&&p.z-r<b.z1){
  const a=b.x1-(p.x-r),c=(p.x+r)-b.x0,d=b.z1-(p.z-r),e=(p.z+r)-b.z0,m=Math.min(a,c,d,e);
  if(m===a)p.x+=a;else if(m===c)p.x-=c;else if(m===d)p.z+=d;else p.z-=e;}}}

  updateSignals(T);const st=carSig(T);
  for(const c of cars){let target=c.vmax;
    if(st!=='g'){const d=(GATE_S-c.s)*c.dir;if(d>c.hl+5&&d<c.hl+20)target=Math.min(target,Math.max(0,(d-c.hl-5.5)*1.2));}
    for(const o of cars){if(o===c||o.dir!==c.dir)continue;const a=(o.s-c.s)*c.dir;if(a>0&&a<c.hl+o.hl+10)target=Math.min(target,Math.max(0,(a-c.hl-o.hl-2.5)*1.4));}
    for(const w of walkers){const rx=w.x-c.pos[0],rz=w.z-c.pos[1];const along=rx*c.fw[0]+rz*c.fw[1];const lat=Math.abs(-rx*c.fw[1]+rz*c.fw[0]);
      if(along>-c.hl&&along<c.hl+8&&lat<2.1)target=Math.min(target,Math.max(0,(along-c.hl-1.3)*1.5));}
    for(const v of WV){if(v.t===1)continue;const rx=v.g.position.x-c.pos[0],rz=v.g.position.z-c.pos[1];const along=rx*c.fw[0]+rz*c.fw[1];const lat=Math.abs(-rx*c.fw[1]+rz*c.fw[0]);const ext=v.t===3?4.8:v.t===2?2.2:.9;
      if(along>-c.hl&&along<c.hl+ext+8&&lat<2.4)target=Math.min(target,Math.max(0,(along-c.hl-ext-1)*1.5));}
    if(c.hl>3&&c.dir>0){const d=STOP_S-c.s;if(c.wait>0){c.wait-=dt;target=0;if(c.wait<=0)c.done=true;}else if(!c.done&&d>-.5&&d<25){target=Math.min(target,Math.max(0,d*.9));if(d<.6&&c.v<.4)c.wait=5;}if(d<-30||d>60)c.done=false;}
    const dv=target-c.v;c.v+=Math.max(-14*dt,Math.min(4*dt,dv));c.s+=c.v*c.dir*dt;
    if(c.s>RP.len)c.s-=RP.len;if(c.s<0)c.s+=RP.len;
    carUpdatePos(c);const[x,z]=c.pos;c.g.position.set(x,groundY(x,z)+.05,z);c.g.rotation.y=Math.atan2(c.fw[0],c.fw[1]);
    c.wheels.forEach(w=>w.rotation.x+=c.v*dt/.4);}

  DOOR_ARROWS.forEach((a,i)=>{a.position.y+=Math.sin(T*3+i)*.006;a.rotation.y+=dt*1.5;});
  if(fountainJet){fountainJet.scale.y=1+Math.sin(T*6)*.12;}
  clouds.children.forEach((cg,i)=>{cg.position.x+=dt*(1.5+i%3);if(cg.position.x>320)cg.position.x=-320;});

  // 카메라
  tmpT.set(p.x,p.y+1.6,p.z);
  const cpit=Math.max(pitch,-.05);tmpV.set(Math.sin(yaw)*Math.cos(cpit),Math.sin(cpit),Math.cos(yaw)*Math.cos(cpit));
  ray.set(tmpT,tmpV);ray.far=dist;const hit=(INSIDE||dist<22)?ray.intersectObjects(INSIDE?INSIDE.walls:buildingMeshes,false)[0]:null;
  let cd=hit?Math.max(Math.min(1.2,dist),hit.distance-.4):dist;
  player.visible=cd>1.05&&!(veh&&VT[veh].hide);if(!INSIDE){scene.fog.near=70+dist*1.5;scene.fog.far=320+dist*3.5;}
  camera.position.copy(tmpT).addScaledVector(tmpV,cd);
  if(INSIDE){camera.position.y=Math.max(.3,Math.min(INSIDE.H-.3,camera.position.y));}else{const cg=groundY(camera.position.x,camera.position.z)+.4;if(camera.position.y<cg)camera.position.y=cg;}if(pitch<-.05)tmpT.y+=Math.tan(Math.min(1.35,-pitch*1.15))*cd;camera.lookAt(tmpT);

  sun.position.set(p.x+40,p.y+80,p.z+28);sun.target.position.set(p.x,p.y,p.z);
  stars.position.copy(camera.position);

  const an=areaName(p.x,p.z);if(an!==curArea){curArea=an;locEl.textContent=an;locEl.style.opacity=1;locT=2.6;}
  if(locT>0){locT-=dt;if(locT<=0)locEl.style.opacity=0;}
  drawMap();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
})();
</script>
